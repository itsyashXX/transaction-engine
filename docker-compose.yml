version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: transaction_engine_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: transaction_engine
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongo --quiet) -eq 1
      interval: 10s
      start_period: 30s

volumes:
  mongo_data:
